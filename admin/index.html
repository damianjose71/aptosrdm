<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración - Reserva del Mar</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url">
    <style>
      /* Personalización de la interfaz del CMS */
      :root {
        --primary-color: #0F172A;
        --accent-color: #C5A059;
      }
      /* Estilos para encabezados y botones del CMS */
      div[class*="AppHeader"], header {
        background-color: #0F172A !important;
      }
      button[class*="Button-button-default-blue"], 
      a[class*="Button-button-default-blue"],
      button[class*="SidebarNavLinkActive"] {
        background-color: #C5A059 !important;
        color: #ffffff !important;
      }
      body, input, select, textarea {
        font-family: inherit !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
